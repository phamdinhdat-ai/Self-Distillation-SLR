# =============================================================================
# Combined Tier 1 Enhancements
# VAC alignment + AMP + gradient accumulation + temporal augmentation + EMA
# =============================================================================
data:
  synthetic: true
  batch_size: 2
  temporal_aug:
    enabled: true
    temporal_mask_prob: 0.3
    temporal_mask_max_ratio: 0.15
    temporal_jitter_range: 0.2

loss:
  feature_alignment:
    enabled: true
    weight: 0.1
    mode: "cosine"
  entropy_regularization:
    enabled: true
    weight: 0.01

optimization:
  use_amp: true
  grad_accum_steps: 2
  use_ema: true
  ema_decay: 0.999

schedule:
  epochs: 100
  smooth_transitions: true
  smooth_transition_epochs: 5

output:
  experiment_name: "combined_tier1"
